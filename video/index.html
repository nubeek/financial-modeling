<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Wefranch — Financial Modeling Demo</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&amp;family=Roboto+Mono:wght@500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/video/styles.css" />
  </head>
  <body>
    <main class="video-stage" aria-label="Financial modeling product demo">
      <div class="video-intro-backdrop" data-backdrop-state="hidden" aria-hidden="true"></div>

      <div class="video-intro" data-playback-state="hidden" data-intro-batch="1" aria-hidden="true">
        <div class="video-intro__stack">
          <h1 class="video-intro__batch" data-batch="1" aria-label="Finally, a compliant way">
            <span class="video-intro__line" aria-hidden="true">
              <span class="video-intro__word-mask" style="--word-index: 0">
                <span class="video-intro__word">Finally</span>
              </span>
            </span>
            <span class="video-intro__line" aria-hidden="true">
              <span class="video-intro__word-mask" style="--word-index: 1">
                <span class="video-intro__word">a</span>
              </span>
              <span class="video-intro__word-mask" style="--word-index: 2">
                <span class="video-intro__word">compliant</span>
              </span>
              <span class="video-intro__word-mask" style="--word-index: 3">
                <span class="video-intro__word">way</span>
              </span>
            </span>
          </h1>

          <h1
            class="video-intro__batch"
            data-batch="2"
            aria-label="For qualified franchise leads"
            aria-hidden="true"
          >
            <span class="video-intro__line" aria-hidden="true">
              <span class="video-intro__word-mask" style="--word-index: 0">
                <span class="video-intro__word">for</span>
              </span>
              <span class="video-intro__word-mask" style="--word-index: 1">
                <span class="video-intro__word">qualified</span>
              </span>
            </span>
            <span class="video-intro__line" aria-hidden="true">
              <span class="video-intro__word-mask" style="--word-index: 2">
                <span class="video-intro__word">franchise</span>
              </span>
              <span class="video-intro__word-mask" style="--word-index: 3">
                <span class="video-intro__word">leads</span>
              </span>
            </span>
          </h1>

          <h1
            class="video-intro__batch video-intro__batch--dark"
            data-batch="3"
            aria-label="To model potential earnings"
            aria-hidden="true"
          >
            <span class="video-intro__line" aria-hidden="true">
              <span class="video-intro__word-mask" style="--word-index: 0">
                <span class="video-intro__word">to</span>
              </span>
              <span class="video-intro__word-mask" style="--word-index: 1">
                <span class="video-intro__word">model</span>
              </span>
            </span>
            <span class="video-intro__line video-intro__line--emphasis" aria-hidden="true">
              <span class="video-intro__word-mask" style="--word-index: 2">
                <span class="video-intro__word">potential</span>
              </span>
              <span class="video-intro__word-mask" style="--word-index: 3">
                <span class="video-intro__word">earnings</span>
              </span>
            </span>
          </h1>
        </div>
      </div>

      <div
        class="solution__iframe-shell"
        data-visual="comprehensive"
        aria-hidden="true"
      >
        <div class="solution__iframe-stage" data-playback-state="hidden" aria-hidden="true">
          <div class="solution__iframe-viewport">
            <iframe
              class="solution__iframe"
              src="/video/ui/?embed=1&amp;feature=comprehensive"
              title="Decimal financial modeling product demo"
              referrerpolicy="no-referrer"
            ></iframe>
          </div>
        </div>
      </div>

      <div class="video-outro" data-playback-state="hidden" aria-hidden="true">
        <h1
          class="video-outro__batch"
          aria-label="Prospects with access to sellside franchise models 82% faster"
        >
          <span class="video-outro__copy" aria-hidden="true">
            <span class="video-outro__line">
              <span class="video-outro__word-mask" style="--word-index: 0">
                <span class="video-outro__word">Prospects</span>
              </span>
              <span class="video-outro__word-mask" style="--word-index: 1">
                <span class="video-outro__word">with</span>
              </span>
              <span class="video-outro__word-mask" style="--word-index: 2">
                <span class="video-outro__word">access</span>
              </span>
            </span>
            <span class="video-outro__line">
              <span class="video-outro__word-mask" style="--word-index: 3">
                <span class="video-outro__word">to</span>
              </span>
              <span class="video-outro__word-mask" style="--word-index: 4">
                <span class="video-outro__word">sellside</span>
              </span>
              <span class="video-outro__word-mask" style="--word-index: 5">
                <span class="video-outro__word">franchise</span>
              </span>
              <span class="video-outro__word-mask" style="--word-index: 6">
                <span class="video-outro__word">models</span>
              </span>
            </span>
          </span>
          <span class="video-outro__stat-mask" aria-hidden="true">
            <span class="video-outro__stat" aria-label="82% faster">
              <span class="video-outro__stat-value" aria-hidden="true">
                <span class="video-outro__slot" data-slot-column="tens">
                  <span class="video-outro__slot-track"></span>
                </span>
                <span class="video-outro__slot" data-slot-column="ones">
                  <span class="video-outro__slot-track"></span>
                </span>
              </span>
              <span class="video-outro__stat-suffix">% faster</span>
            </span>
          </span>
        </h1>
      </div>
    </main>

    <div class="video-controls" role="group" aria-label="Video controls">
      <div class="video-controls__transport">
        <button
          class="video-controls__icon-button"
          id="playbackToggle"
          type="button"
          aria-label="Pause animation"
        >
          <img src="/video/assets/pause.svg" alt="" width="13" height="13" />
        </button>
        <span class="video-controls__time" aria-label="Playback time">
          <span id="currentTime">0:00</span>
          <span aria-hidden="true">/</span>
          <span id="duration">0:32</span>
        </span>
      </div>

      <div
        class="video-controls__timeline"
        id="timeline"
        role="slider"
        aria-label="Video timeline"
        aria-valuemin="0"
        aria-valuemax="32"
        aria-valuenow="0"
        aria-valuetext="0:00 of 0:32"
        tabindex="0"
      >
        <span class="video-controls__progress" id="timelineProgress"></span>
        <span class="video-controls__timeline-thumb" aria-hidden="true"></span>
      </div>

      <button
        class="video-controls__mute"
        id="muteToggle"
        type="button"
        aria-label="Mute audio"
        aria-pressed="false"
      >
        <img src="/video/assets/mute.svg" alt="" width="15" height="15" />
      </button>
    </div>

    <audio
      id="demoAudio"
      src="/video/assets/audio.mp3"
      preload="auto"
      hidden
    ></audio>

    <script type="module" src="/video/app.js"></script>
  </body>
</html>
